name: Build Lambda Estoque (manual)
# Este workflow existe apenas para build manual isolado.
# O deploy automático do Lambda Estoque está em deploy-dev.yml

on:
  workflow_dispatch:

jobs:
  build:
    name: Build e Deploy manual – Lambda Estoque
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./servico-estoque

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (.NET 8 managed runtime – linux-x64)
        run: |
          dotnet publish ServicoEstoque.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o lambda-publish

      - name: Create ZIP
        run: |
          cd lambda-publish
          zip -r ../lambda-estoque-${{ github.sha }}.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy – nfe-estoque-dev
        run: |
          aws lambda update-function-code \
            --function-name nfe-estoque-dev \
            --zip-file fileb://lambda-estoque-${{ github.sha }}.zip
          aws lambda wait function-updated --function-name nfe-estoque-dev
          echo "nfe-estoque-dev updated"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-estoque-${{ github.sha }}
          path: servico-estoque/lambda-estoque-${{ github.sha }}.zip
          retention-days: 7
