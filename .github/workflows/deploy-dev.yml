name: Deploy – Development

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'servico-faturamento/**'
      - 'servico-estoque/**'
      - 'web-app/**'
      - 'infra/cdk/**'
      - '.github/workflows/deploy-dev.yml'

env:
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────────────────
  # Go Lambdas – Faturamento, Outbox, PDF
  # ─────────────────────────────────────────
  deploy-faturamento:
    name: Deploy Lambdas – Faturamento (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./servico-faturamento

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: servico-faturamento/go.mod
          cache-dependency-path: servico-faturamento/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build – Lambda principal
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o build/bootstrap \
            ./cmd/lambda/main.go

      - name: Build – Lambda Outbox
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o build-outbox/bootstrap \
            ./cmd/lambda-outbox/main.go

      - name: Build – Lambda PDF
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o build-pdf/bootstrap \
            ./cmd/lambda-pdf/main.go

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy – nfe-faturamento-dev
        run: |
          cd build && zip bootstrap.zip bootstrap
          aws lambda update-function-code \
            --function-name nfe-faturamento-dev \
            --zip-file fileb://bootstrap.zip
          aws lambda wait function-updated --function-name nfe-faturamento-dev
          echo "nfe-faturamento-dev updated"

      - name: Deploy – nfe-outbox-processor-dev
        run: |
          cd build-outbox && zip bootstrap.zip bootstrap
          aws lambda update-function-code \
            --function-name nfe-outbox-processor-dev \
            --zip-file fileb://bootstrap.zip
          aws lambda wait function-updated --function-name nfe-outbox-processor-dev
          echo "nfe-outbox-processor-dev updated"

      - name: Deploy – nfe-pdf-generator-dev
        run: |
          cd build-pdf && zip bootstrap.zip bootstrap
          aws lambda update-function-code \
            --function-name nfe-pdf-generator-dev \
            --zip-file fileb://bootstrap.zip
          aws lambda wait function-updated --function-name nfe-pdf-generator-dev
          echo "nfe-pdf-generator-dev updated"

  # ─────────────────────────────────────────
  # .NET 8 Lambda – Estoque (managed runtime)
  # ─────────────────────────────────────────
  deploy-estoque:
    name: Deploy Lambda – Estoque (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./servico-estoque

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (.NET 8 managed runtime – linux-x64)
        run: |
          dotnet publish ServicoEstoque.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o lambda-publish

      - name: Create ZIP
        run: |
          cd lambda-publish
          zip -r ../lambda-estoque.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy – nfe-estoque-dev
        run: |
          aws lambda update-function-code \
            --function-name nfe-estoque-dev \
            --zip-file fileb://lambda-estoque.zip
          aws lambda wait function-updated --function-name nfe-estoque-dev
          echo "nfe-estoque-dev updated"

  # ─────────────────────────────────────────
  # Angular – S3 + CloudFront
  # ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend – S3 + CloudFront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build production
        run: npm run build:prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/web-app/ \
            s3://nfe-frontend-dev-246599827442/ \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3GS1ORK9UYGOX \
            --paths "/*"

  # ─────────────────────────────────────────
  # CDK – Deploy infra (apenas quando infra/cdk muda)
  # ─────────────────────────────────────────
  deploy-infra:
    name: Deploy CDK Infra
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ','), 'infra/cdk') ||
      contains(join(github.event.commits.*.added, ','), 'infra/cdk')
    defaults:
      run:
        working-directory: ./infra/cdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy serverless stack (dev)
        run: npm run deploy:serverless:dev -- --require-approval never

  # ─────────────────────────────────────────
  # Health check – verifica os endpoints
  # ─────────────────────────────────────────
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-faturamento, deploy-estoque, deploy-frontend]
    if: always() && needs.deploy-faturamento.result == 'success' && needs.deploy-estoque.result == 'success'

    steps:
      - name: Health – Faturamento
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://rtbyoojhhd.execute-api.us-east-1.amazonaws.com/dev/health)
          echo "Faturamento health: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Health – Estoque
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://t5baqexuo5.execute-api.us-east-1.amazonaws.com/dev/health)
          echo "Estoque health: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Summary
        run: |
          echo "Deploy DEV concluído!"
          echo "Frontend: https://d1gdw7rlsi8u42.cloudfront.net"
          echo "API Faturamento: https://rtbyoojhhd.execute-api.us-east-1.amazonaws.com/dev/api/v1"
          echo "API Estoque: https://t5baqexuo5.execute-api.us-east-1.amazonaws.com/dev/api/v1"
