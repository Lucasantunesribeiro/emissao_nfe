name: Deploy to Development

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'servico-faturamento/**'
      - 'servico-estoque/**'
      - 'web-app/**'
      - 'infra/cdk/**'

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  LAMBDA_FATURAMENTO: nfe-faturamento-dev
  S3_BUCKET: nfe-frontend-dev-246599827442
  CLOUDFRONT_ID: E3GS1ORK9UYGOX

jobs:
  deploy-lambda-faturamento:
    name: Build and Deploy Lambda Faturamento (Go)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified + github.event.commits.*.added), 'servico-faturamento/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: servico-faturamento/go.sum

      - name: Build Lambda binary
        working-directory: servico-faturamento
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -tags lambda.norpc \
            -o build/bootstrap \
            cmd/lambda/main.go

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        working-directory: servico-faturamento/build
        run: |
          zip bootstrap.zip bootstrap
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FATURAMENTO }} \
            --zip-file fileb://bootstrap.zip
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FATURAMENTO }}
          echo "Lambda faturamento updated successfully"

  deploy-frontend:
    name: Build and Deploy Frontend (Angular)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified + github.event.commits.*.added), 'web-app/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        working-directory: web-app
        run: npm ci

      - name: Build Angular app
        working-directory: web-app
        run: npm run build -- --configuration=production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        working-directory: web-app
        run: |
          aws s3 sync dist/web-app/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_ID }} \
            --paths "/*"
