name: Deploy – Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite "DEPLOY-PROD" para confirmar'
        required: true
        type: string

env:
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────────────────
  # Gate – confirmação obrigatória
  # ─────────────────────────────────────────
  gate:
    name: Validar confirmação
    runs-on: ubuntu-latest
    steps:
      - name: Verificar confirmação
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY-PROD" ]; then
            echo "Confirmação inválida. Digite exatamente: DEPLOY-PROD"
            exit 1
          fi
          echo "Confirmação validada. Iniciando deploy para produção..."

  # ─────────────────────────────────────────
  # Go Lambdas – Faturamento, Outbox, PDF
  # ─────────────────────────────────────────
  deploy-faturamento:
    name: Deploy Lambdas – Faturamento (Go)
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: ./servico-faturamento

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: servico-faturamento/go.mod
          cache-dependency-path: servico-faturamento/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build – Lambda principal
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o build/bootstrap \
            ./cmd/lambda/main.go

      - name: Build – Lambda Outbox
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o build-outbox/bootstrap \
            ./cmd/lambda-outbox/main.go

      - name: Build – Lambda PDF
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o build-pdf/bootstrap \
            ./cmd/lambda-pdf/main.go

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy – nfe-faturamento-prod
        run: |
          cd build && zip bootstrap.zip bootstrap
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FATURAMENTO_PROD || 'nfe-faturamento-prod' }} \
            --zip-file fileb://bootstrap.zip
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FATURAMENTO_PROD || 'nfe-faturamento-prod' }}

      - name: Deploy – nfe-outbox-processor-prod
        run: |
          cd build-outbox && zip bootstrap.zip bootstrap
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_OUTBOX_PROD || 'nfe-outbox-processor-prod' }} \
            --zip-file fileb://bootstrap.zip
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_OUTBOX_PROD || 'nfe-outbox-processor-prod' }}

      - name: Deploy – nfe-pdf-generator-prod
        run: |
          cd build-pdf && zip bootstrap.zip bootstrap
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_PDF_PROD || 'nfe-pdf-generator-prod' }} \
            --zip-file fileb://bootstrap.zip
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_PDF_PROD || 'nfe-pdf-generator-prod' }}

  # ─────────────────────────────────────────
  # .NET 8 Lambda – Estoque
  # ─────────────────────────────────────────
  deploy-estoque:
    name: Deploy Lambda – Estoque (.NET 8)
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: ./servico-estoque

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (.NET 8 managed runtime – linux-x64)
        run: |
          dotnet publish ServicoEstoque.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o lambda-publish

      - name: Create ZIP
        run: |
          cd lambda-publish
          zip -r ../lambda-estoque.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy – nfe-estoque-prod
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_ESTOQUE_PROD || 'nfe-estoque-prod' }} \
            --zip-file fileb://lambda-estoque.zip
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_ESTOQUE_PROD || 'nfe-estoque-prod' }}

  # ─────────────────────────────────────────
  # Angular – S3 + CloudFront
  # ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend – S3 + CloudFront
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: ./web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build:prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/web-app/ \
            s3://${{ secrets.S3_BUCKET_PROD }} \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ID_PROD }} \
            --paths "/*"

  # ─────────────────────────────────────────
  # Health check – produção
  # ─────────────────────────────────────────
  health-check:
    name: Health Check – Produção
    runs-on: ubuntu-latest
    needs: [deploy-faturamento, deploy-estoque, deploy-frontend]

    steps:
      - name: Health – Faturamento
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            ${{ secrets.API_FATURAMENTO_URL_PROD }}/health)
          echo "Faturamento health: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Health – Estoque
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            ${{ secrets.API_ESTOQUE_URL_PROD }}/health)
          echo "Estoque health: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Summary
        run: |
          echo "Deploy PRODUÇÃO concluído!"
          echo "Commit: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"
