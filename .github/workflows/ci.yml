name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Go – Faturamento (Lambda principal, outbox, PDF)
  # ─────────────────────────────────────────
  ci-faturamento:
    name: Build & Vet – Faturamento (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./servico-faturamento

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: servico-faturamento/go.mod
          cache-dependency-path: servico-faturamento/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet (pacotes Lambda)
        run: |
          go vet ./cmd/lambda/...
          go vet ./cmd/lambda-outbox/...
          go vet ./cmd/lambda-pdf/...
          go vet ./cmd/lambda-estoque-consumer/...
          go vet ./internal/...

      - name: Test
        run: go test ./...

      - name: Build – Lambda principal
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-faturamento \
            ./cmd/lambda/main.go

      - name: Build – Lambda Outbox
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-outbox \
            ./cmd/lambda-outbox/main.go

      - name: Build – Lambda PDF
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-pdf \
            ./cmd/lambda-pdf/main.go

      - name: Build – Lambda Estoque Consumer
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-estoque-consumer \
            ./cmd/lambda-estoque-consumer/main.go

  # ─────────────────────────────────────────
  # .NET 8 – Estoque (managed runtime, DLLs)
  # ─────────────────────────────────────────
  ci-estoque:
    name: Build – Estoque (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./servico-estoque

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

  # ─────────────────────────────────────────
  # Angular 17 – Frontend
  # ─────────────────────────────────────────
  ci-frontend:
    name: Build – Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build production
        run: npm run build:prod

  # ─────────────────────────────────────────
  # AWS CDK – Serverless stack synth
  # ─────────────────────────────────────────
  ci-cdk:
    name: Synth – CDK Serverless
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/cdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run build

      - name: Criar placeholders de assets Lambda (necessário para cdk synth sem builds reais)
        run: |
          mkdir -p ../../servico-faturamento/build
          touch ../../servico-faturamento/build/bootstrap
          mkdir -p ../../servico-faturamento/build-outbox
          touch ../../servico-faturamento/build-outbox/bootstrap
          mkdir -p ../../servico-faturamento/build-pdf
          touch ../../servico-faturamento/build-pdf/bootstrap
          mkdir -p ../../servico-faturamento/build-estoque-consumer
          touch ../../servico-faturamento/build-estoque-consumer/bootstrap
          mkdir -p ../../servico-estoque/publish-dynamodb
          touch ../../servico-estoque/publish-dynamodb/placeholder
          mkdir -p ../../infra/lambda-authorizer/dist
          touch ../../infra/lambda-authorizer/dist/index.js

      - name: Synth (dev)
        run: npm run synth:serverless -- --context env=dev
