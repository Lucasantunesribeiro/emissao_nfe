name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-faturamento:
    name: Build and Test - Faturamento (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Testes de integracao de internal/repositorio (reserva atomica de estoque)
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    defaults:
      run:
        working-directory: ./servico-faturamento

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: servico-faturamento/go.mod
          cache-dependency-path: servico-faturamento/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (unitarios + integracao com DynamoDB Local)
        run: go test -count=1 ./...

      - name: Build - Lambda principal
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-faturamento \
            ./cmd/lambda/main.go

      - name: Build - Lambda PDF
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-pdf \
            ./cmd/lambda-pdf/main.go

      - name: Build - Lambda Estoque Consumer
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-estoque-consumer \
            ./cmd/lambda-estoque-consumer/main.go

      - name: Build - Lambda Outbox
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-outbox \
            ./cmd/lambda-outbox/main.go

  ci-estoque:
    name: Build and Test - Estoque (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./servico-estoque

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('servico-estoque/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test Tests/ServicoEstoque.Tests.csproj --no-build

      - name: Publish - Outbox Publisher
        run: |
          dotnet publish OutboxPublisher/OutboxPublisher.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o OutboxPublisher/publish

  ci-frontend:
    name: Build and Test - Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:ci

      - name: Build production
        run: npm run build:prod

      # Bloqueia em vulnerabilidade critica. As "high" restantes sao do Angular
      # 19 (fim de suporte; correcao so com upgrade major para 20+), entao o
      # relatorio high fica informativo ate o upgrade.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=critical

      - name: Security audit high (informativo)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  ci-cdk:
    name: Synth - CDK Serverless
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./infra/cdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Create Lambda asset placeholders
        run: |
          mkdir -p ../../servico-faturamento/build
          touch ../../servico-faturamento/build/bootstrap
          mkdir -p ../../servico-faturamento/build-pdf
          touch ../../servico-faturamento/build-pdf/bootstrap
          mkdir -p ../../servico-faturamento/build-estoque-consumer
          touch ../../servico-faturamento/build-estoque-consumer/bootstrap
          mkdir -p ../../servico-estoque/publish-dynamodb
          touch ../../servico-estoque/publish-dynamodb/placeholder
          mkdir -p ../../servico-estoque/OutboxPublisher/publish
          touch ../../servico-estoque/OutboxPublisher/publish/placeholder

      - name: Build Lambda Authorizer
        working-directory: ./infra/lambda-authorizer
        run: npm ci && npm run build

      - name: Synth (dev)
        run: npm run synth:serverless -- --context env=dev

  ci-compose:
    name: Validar docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: docker compose config -q
