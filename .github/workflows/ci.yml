name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Go – Faturamento (Lambda principal, outbox, PDF)
  # ─────────────────────────────────────────
  ci-faturamento:
    name: Build & Vet – Faturamento (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./servico-faturamento

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: servico-faturamento/go.mod
          cache-dependency-path: servico-faturamento/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build – Lambda principal
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-faturamento \
            ./cmd/lambda/main.go

      - name: Build – Lambda Outbox
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-outbox \
            ./cmd/lambda-outbox/main.go

      - name: Build – Lambda PDF
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags lambda.norpc -o /tmp/bootstrap-pdf \
            ./cmd/lambda-pdf/main.go

  # ─────────────────────────────────────────
  # .NET 8 – Estoque (managed runtime, DLLs)
  # ─────────────────────────────────────────
  ci-estoque:
    name: Build – Estoque (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./servico-estoque

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

  # ─────────────────────────────────────────
  # Angular 17 – Frontend
  # ─────────────────────────────────────────
  ci-frontend:
    name: Build – Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build:prod

  # ─────────────────────────────────────────
  # AWS CDK – Serverless stack synth
  # ─────────────────────────────────────────
  ci-cdk:
    name: Synth – CDK Serverless
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/cdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Synth (dev)
        run: npm run synth:serverless -- --context env=dev
