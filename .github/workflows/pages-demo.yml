name: Deploy - Demo frontend (GitHub Pages)

# Proposta: publica o web-app no GitHub Pages (gratuito) apontando para o backend da demo
# (Render free, ver render.yaml). Nunca roda em pull_request.
# Pre-requisitos (uma vez, feitos pelo dono do repo):
#   1. Settings > Pages > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > Variables:
#      DEMO_API_URL = URL publica do servico no Render (ex.: https://emissao-nfe-demo.onrender.com)
# Somente manual enquanto o Pages e DEMO_API_URL nao estiverem configurados.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Validar configuracao
        env:
          DEMO_API_URL: ${{ vars.DEMO_API_URL }}
        run: |
          if [ -z "$DEMO_API_URL" ]; then
            echo "::error::Defina a variavel de repositorio DEMO_API_URL (URL do backend no Render)."
            exit 1
          fi

      - run: npm ci

      - name: Build (auth desativada, API da demo)
        env:
          API_ESTOQUE_URL: ${{ vars.DEMO_API_URL }}/api/v1
          API_FATURAMENTO_URL: ${{ vars.DEMO_API_URL }}/api/v1
          AUTH_ENABLED: "false"
          APP_ENVIRONMENT_NAME: "Demo - homologacao (sem valor fiscal)"
        run: |
          npm run build:prod -- --base-href "/${{ github.event.repository.name }}/"
          # SPA: rotas profundas no Pages caem no 404.html, que carrega o app.
          cp dist/web-app/index.html dist/web-app/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-app/dist/web-app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
