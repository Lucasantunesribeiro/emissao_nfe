# Ambiente local de desenvolvimento.
#
#   cp .env.example .env
#   docker compose up --build
#
# O que sobe:
#   - dynamodb-local: DynamoDB Local (substitui o DynamoDB da AWS)
#   - dynamodb-init: cria as tabelas main/events com o esquema do CDK
#   - servico-estoque: API .NET 8 (Kestrel) em http://localhost:5001
#   - servico-faturamento: Lambda Go da API em modo HTTP (HTTP_ADDR) em
#       http://localhost:5002 (ver servico-faturamento/internal/demohttp/servidor.go)
#   - web-app: Angular servido por nginx em http://localhost:4200
#
# NAO ha EventBridge/SQS/S3/Cognito locais. Em vez deles, o modo HTTP executa
# a saga de reserva e a geracao de PDF de forma sincrona (DEMO_SAGA_SINCRONA /
# DEMO_PDF_SINCRONO). Ambiente fiscal: sempre homologacao.
name: emissao-nfe

x-aws-local: &aws-local
  AWS_REGION: ${AWS_REGION:-us-east-1}
  # Credenciais FIXAS e ficticias, aceitas pelo DynamoDB Local (so letras e
  # numeros). Nao sao lidas do shell de proposito: assim chaves reais da AWS
  # exportadas na maquina do desenvolvedor nunca entram nos containers.
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
  DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-nfe-main-local}
  DYNAMODB_EVENTS_TABLE_NAME: ${DYNAMODB_EVENTS_TABLE_NAME:-nfe-events-local}
  EVENT_BUS_NAME: ${EVENT_BUS_NAME:-nfe-events-local}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "${DYNAMODB_LOCAL_PORT:-8000}:8000"

  dynamodb-init:
    image: amazon/aws-cli:2.17.0
    depends_on:
      - dynamodb-local
    environment:
      <<: *aws-local
    entrypoint: ["/bin/sh", "-c", "sleep 3 && /scripts/criar-tabelas.sh"]
    volumes:
      - ./scripts/local:/scripts:ro
    restart: "no"

  servico-estoque:
    build:
      context: ./servico-estoque
      dockerfile: Dockerfile
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      <<: *aws-local
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${SERVICO_ESTOQUE_PORT:-5001}:8080"

  servico-faturamento:
    build:
      context: ./servico-faturamento
      dockerfile: Dockerfile
      args:
        LAMBDA: lambda
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      <<: *aws-local
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Homologacao (tpAmb=2) e o padrao; producao nunca deve ser usada localmente.
      NFE_AMBIENTE: homologacao
      HTTP_ADDR: ":8080"
      DEMO_SAGA_SINCRONA: "true"
      DEMO_PDF_SINCRONO: "true"
      DEMO_PUBLIC_URL: http://localhost:${SERVICO_FATURAMENTO_PORT:-5002}
    ports:
      - "${SERVICO_FATURAMENTO_PORT:-5002}:8080"

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    depends_on:
      - servico-estoque
      - servico-faturamento
    ports:
      - "${WEBAPP_PORT:-4200}:80"
